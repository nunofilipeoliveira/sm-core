# =============================================================================
# Endurecimento especifico de PROD (ver docs/DoS-PROTECTION.md)
# =============================================================================

# Menos pedidos simultaneos: em carga anormal a resposta e rapida (503) em vez
# de acumular threads a espera de ligacoes ao banco de dados.
sm.core.security.rate-limit.max-concurrent-requests=50
sm.core.security.rate-limit.global.max-concurrent-requests=15

# BD: falhar depressa em vez de deixar threads presas 30s
spring.datasource.hikari.connectionTimeout=5000

# Actuator: health (usado por monitorizacao) + prometheus (scrape)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# Necessario para expor metricas tomcat.* (threads/ligacoes) no Prometheus —
# sao as metricas mais uteis para detetar saturacao/ataque.
server.tomcat.mbeanregistry.enabled=true

# Se o prometheus/blackbox correr fora da rede do docker, descomentar e ajustar
# a allowlist de IPs autorizados a aceder a /actuator/**:
#sm.core.security.rate-limit.actuator-allowed-clients[0]=127.0.0.1
#sm.core.security.rate-limit.actuator-allowed-clients[1]=172.16.0.0/12
