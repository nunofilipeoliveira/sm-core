# =============================================================================
# Endurecimento contra abuso / ataques DoS
# Documentacao completa: docs/DoS-PROTECTION.md
# =============================================================================

# --- Limite de trafego HTTP (token bucket por IP + concorrencia) ---
sm.core.security.rate-limit.enabled=true
# Colocar true apenas se a app estiver atras de reverse proxy fiavel E a porta
# da aplicacao nao estiver acessivel diretamente (senao o cabecalho e falsificavel)
sm.core.security.rate-limit.trust-client-ip-header=false
sm.core.security.rate-limit.client-ip-header=X-Forwarded-For
sm.core.security.rate-limit.max-tracked-clients=20000
sm.core.security.rate-limit.bucket-idle-seconds=900
sm.core.security.rate-limit.cleanup-interval-seconds=120
sm.core.security.rate-limit.max-request-body-bytes=1048576
sm.core.security.rate-limit.max-concurrent-requests=100
# Allowlist opcional para /actuator/** (vazio = sem restricao por IP)
#sm.core.security.rate-limit.actuator-allowed-clients[0]=127.0.0.1
#sm.core.security.rate-limit.actuator-allowed-clients[1]=172.16.0.0/12

# Regra geral (todos os endpoints)
sm.core.security.rate-limit.global.capacity=300
sm.core.security.rate-limit.global.refill-per-second=80
sm.core.security.rate-limit.global.max-concurrent-requests=20
# Autenticacao / criacao de utilizadores (protege BCrypt + BD)
sm.core.security.rate-limit.login.capacity=15
sm.core.security.rate-limit.login.refill-per-second=0.5
sm.core.security.rate-limit.login.max-concurrent-requests=4
# Sessao (JWT)
sm.core.security.rate-limit.session.capacity=150
sm.core.security.rate-limit.session.refill-per-second=15
sm.core.security.rate-limit.session.max-concurrent-requests=20
# Envio de emails (protege a conta SMTP)
sm.core.security.rate-limit.email.capacity=3
sm.core.security.rate-limit.email.refill-per-second=0.02
sm.core.security.rate-limit.email.max-concurrent-requests=2
# Uploads de ficheiros (protege disco + memoria)
sm.core.security.rate-limit.upload.capacity=30
sm.core.security.rate-limit.upload.refill-per-second=0.5
sm.core.security.rate-limit.upload.max-concurrent-requests=3
# Sonda de saude (consulta a BD) e Actuator
sm.core.security.rate-limit.probe.capacity=30
sm.core.security.rate-limit.probe.refill-per-second=1
sm.core.security.rate-limit.probe.max-concurrent-requests=5
sm.core.security.rate-limit.actuator.capacity=30
sm.core.security.rate-limit.actuator.refill-per-second=2
sm.core.security.rate-limit.actuator.max-concurrent-requests=5

# --- CORS global (nota: @CrossOrigin nos controladores tem precedencia) ---
sm.core.security.cors.enabled=true
sm.core.security.cors.max-age-seconds=1800
sm.core.security.cors.allowed-origin-patterns[0]=*

# --- WebSocket / STOMP ---
sm.core.security.websocket.allowed-origin-patterns[0]=*
sm.core.security.websocket.max-sessions-per-client=3
sm.core.security.websocket.max-total-sessions=200
sm.core.security.websocket.message-size-limit-bytes=65536
sm.core.security.websocket.send-buffer-size-limit-bytes=262144
sm.core.security.websocket.send-time-limit-millis=10000
sm.core.security.websocket.time-to-first-message-millis=20000
sm.core.security.websocket.inbound-core-pool-size=2
sm.core.security.websocket.inbound-max-pool-size=8
sm.core.security.websocket.inbound-queue-capacity=256
sm.core.security.websocket.outbound-core-pool-size=2
sm.core.security.websocket.outbound-max-pool-size=8
sm.core.security.websocket.outbound-queue-capacity=512

# --- Autenticacao por token JWT nos endpoints ---
# REPORT  = observa e registra em log os pedidos sem token valido (NAO bloqueia)
# ENFORCE = devolve 401 a todos os pedidos sem token valido fora dos public-paths
# ATENCAO: ativar ENFORCE apenas depois de confirmar nos logs (e/ou no front-end)
# que o cliente envia o token no cabecalho Authorization.
sm.core.security.auth.enabled=true
sm.core.security.auth.mode=REPORT
# Cabecalhos aceites para o token (por ordem de tentativa)
sm.core.security.auth.token-headers[0]=Authorization
sm.core.security.auth.token-headers[1]=X-Auth-Token
sm.core.security.auth.token-headers[2]=Token
# Alternativa aceite: ?token=xxx (usada, por exemplo, no handshake WebSocket)
sm.core.security.auth.token-query-parameter=token
# Exigir token valido tambem no handshake WebSocket (/ws-tournament?token=xxx)
sm.core.security.auth.websocket-enforce=false
# Caminhos sem token (por prefixo). Se descomentar, esta lista SUBSTITUI a lista
# por omissao definida em sm.core.config.Auth: /sm/login, /sm/isAuthenticated,
# /sm/extendSession, /sm/createUtilizador, /sm/reenviarEmailAtivacao,
# /sm/activateuser, /sm/getcode, /sm/sonda, /sm/helloworld, /actuator
#sm.core.security.auth.public-paths[0]=/sm/login
#sm.core.security.auth.public-paths[1]=/sm/sonda

# --- Limites do servidor HTTP (Tomcat) ---
server.tomcat.threads.max=60
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=200
server.tomcat.accept-count=40
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=15s
server.tomcat.max-keep-alive-requests=100
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Multipart: ficheiros acima de 256KB passam a usar disco temporario (menos heap)
spring.servlet.multipart.file-size-threshold=256KB

# --- Erros: nao expor stacktrace/detalhes internos ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# --- Actuator / Prometheus ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- SMTP: timeouts para nao prender threads de pedido indefinidamente ---
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
